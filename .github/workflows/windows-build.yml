name: Windows Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate Windows launchers
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem Windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }

          [xml]$appXaml = Get-Content Windows/src/AgentHUD.Windows/App.xaml -Raw
          $mergedDictionaries = $appXaml.Application.Resources.ResourceDictionary.MergedDictionaries
          if ($null -eq $mergedDictionaries -or $null -eq $mergedDictionaries.XamlControlsResources) {
            Write-Host "App.xaml is missing XamlControlsResources."
            $failed = $true
          }

          if ($failed) { exit 1 }

      - name: Restore
        run: dotnet restore Windows/AgentHUD.Windows.sln

      - name: Test core
        run: dotnet test Windows/tests/AgentHUD.Core.Tests/AgentHUD.Core.Tests.csproj -c Release --no-restore

      - name: Build WinUI
        run: dotnet build Windows/AgentHUD.Windows.sln -c Release -p:Platform=x64 --no-restore

      - name: Smoke test WinUI startup
        shell: powershell
        run: |
          $exe = Get-ChildItem Windows/src/AgentHUD.Windows/bin/x64/Release `
            -Filter AgentHUD.Windows.exe `
            -Recurse |
            Select-Object -First 1
          if ($null -eq $exe) { throw "AgentHUD.Windows.exe was not found." }

          $process = Start-Process `
            -FilePath $exe.FullName `
            -WorkingDirectory $exe.DirectoryName `
            -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw ("AgentHUD exited during startup. Exit code: 0x{0:X8}." -f $process.ExitCode)
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AgentHUD-Windows-x64
          path: Windows/src/AgentHUD.Windows/bin/x64/Release
          if-no-files-found: error
