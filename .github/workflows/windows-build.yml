name: Windows Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate Windows launchers
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem Windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Restore
        run: dotnet restore Windows/AgentHUD.Windows.sln

      - name: Test core
        run: dotnet test Windows/tests/AgentHUD.Core.Tests/AgentHUD.Core.Tests.csproj -c Release --no-restore

      - name: Build WinUI
        run: dotnet build Windows/AgentHUD.Windows.sln -c Release -p:Platform=x64 --no-restore

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AgentHUD-Windows-x64
          path: Windows/src/AgentHUD.Windows/bin/x64/Release
          if-no-files-found: error
