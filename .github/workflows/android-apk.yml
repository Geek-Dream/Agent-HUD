name: Android APK

on:
  push:
    branches:
      - main
      - feat/lan-monitoring
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        working-directory: mobile
        run: flutter create --org com.geekdream --platforms=android .

      - name: Remove the generated counter test
        working-directory: mobile
        run: rm -f test/widget_test.dart

      - name: Add Android permissions
        working-directory: mobile
        shell: python
        run: |
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permissions = '''  <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
          '''
          if "android.permission.CAMERA" not in text:
              text = text.replace("    <application", permissions + "    <application", 1)
          path.write_text(text)

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Analyze app source
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentHUD-Android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          prerelease: true
